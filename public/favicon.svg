<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Shield Aura -->
  <path d="M256 64 C336 64 396 96 396 96 V240 C396 336 328 412 256 448 C184 412 116 336 116 240 V96 C116 96 176 64 256 64 Z" fill="#ffffff" opacity="0.25" />
  
  <!-- Main Shield -->
  <path d="M256 88 C324 88 376 116 376 116 V240 C376 320 316 388 256 420 C196 388 136 320 136 240 V116 C136 116 188 88 256 88 Z" fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- Hostel Roof -->
  <path d="M256 140 L340 204 H172 Z" fill="#4f46e5"/>
  
  <!-- Hostel Pillars & Windows -->
  <rect x="188" y="216" width="32" height="96" rx="6" fill="#4f46e5"/>
  <rect x="240" y="216" width="32" height="96" rx="6" fill="#06b6d4"/>
  <rect x="292" y="216" width="32" height="96" rx="6" fill="#4f46e5"/>

  <!-- AI Smart Checkmark Badge -->
  <circle cx="356" cy="152" r="32" fill="#10b981"/>
  <path d="M340 152 L352 164 L372 140" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
