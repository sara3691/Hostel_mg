<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f4ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Shield Aura -->
  <path d="M256 72 C330 72 384 100 384 100 V236 C384 328 320 400 256 436 C192 400 128 328 128 236 V100 C128 100 182 72 256 72 Z" fill="#ffffff" opacity="0.2" />
  
  <!-- Main Shield -->
  <path d="M256 96 C318 96 364 120 364 120 V236 C364 312 310 376 256 408 C202 376 148 312 148 236 V120 C148 120 194 96 256 96 Z" fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- Hostel Roof -->
  <path d="M256 148 L332 208 H180 Z" fill="#4f46e5"/>
  
  <!-- Hostel Pillars & Windows -->
  <rect x="196" y="218" width="28" height="92" rx="6" fill="#4f46e5"/>
  <rect x="242" y="218" width="28" height="92" rx="6" fill="#06b6d4"/>
  <rect x="288" y="218" width="28" height="92" rx="6" fill="#4f46e5"/>

  <!-- AI Smart Checkmark Badge -->
  <circle cx="348" cy="158" r="30" fill="#10b981"/>
  <path d="M334 158 L344 168 L362 148" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>